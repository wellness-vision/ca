<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visor 3D · Proyecto Wellness</title>
<script type="module" src="https://ajax.googleapis.com/ajax/libs/model-viewer/4.1.0/model-viewer.min.js"></script>
<style>
html,body{margin:0;width:100%;height:100%;background:#fff;font-family:Arial,Helvetica,sans-serif}
model-viewer{display:block;width:100%;height:100dvh;background:#fff;--poster-color:#fff}
.info{position:fixed;left:16px;bottom:16px;padding:10px 14px;background:rgba(255,255,255,.94);color:#333;border:1px solid #ddd;border-radius:8px;font-size:13px;pointer-events:none}
#error{display:none;position:fixed;top:16px;left:16px;background:#fff0f0;color:#900;border:1px solid #c88;padding:12px;border-radius:8px}
</style>
</head>
<body>
<model-viewer id="viewer" src="./modelo.glb" alt="Modelo 3D del proyecto Wellness" camera-controls touch-action="pan-y" auto-rotate shadow-intensity="0.8" exposure="1" environment-image="neutral" loading="eager" interaction-prompt="auto">
<div slot="poster" style="display:grid;place-items:center;height:100%;color:#666">Cargando modelo 3D…</div>
</model-viewer>
<div class="info">Arrastra para girar · Rueda para acercar · Botón derecho para desplazar</div>
<div id="error">No se ha podido cargar el modelo. Comprueba que modelo.glb esté junto a index.html.</div>
<script>document.getElementById('viewer').addEventListener('error',()=>document.getElementById('error').style.display='block');</script>
</body>
</html>
